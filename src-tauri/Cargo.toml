[package]
name = "boonsh"
version = "0.10.9"
description = "boonsh - Standalone Hybrid PowerShell & File Manager"
authors = ["Somboon L."]
license = "MIT"
repository = "https://github.com/ssaelao-wq/boonsh"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boonsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
trash = "5"
dirs = "5"
base64 = "0.22"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex-lite = "0.1.9"
# File icons go to the page as PNG (shell_icons.rs); Tauri already builds this version
png = "0.18"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls"] }
tauri-plugin-process = "2.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
sha2 = "0.10"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# File properties (Dimensions, Length, Album ...) from the Windows property system, as in Explorer. The same
# windows 0.61 is already pulled in by Tauri, so this only switches on a few more of its modules.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# the `#[implement]` COM macro (file_drag.rs's drop source) refers to this crate by name; same version as windows'
windows-core = "0.61"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# No incremental cache for debug builds: it kept a new copy for every change of build settings
# (target\debug\incremental grew past 23 GB). Debug rebuilds of boonsh's own code are a little slower instead.
[profile.dev]
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
